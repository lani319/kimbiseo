[project]
name = "ticketing"
version = "0.1.0"
description = "Open-time booking assistant: waits for the server-side open, clicks Book, picks date/round, then hands off to a human"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
ticketing = "ticketing.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ticketing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
