name: kimbiseo

on:
  push:
    branches: [master]
    paths:
      - "widgets/kimbiseo/**"
      - ".github/workflows/kimbiseo.yml"
  pull_request:
    paths:
      - "widgets/kimbiseo/**"
      - ".github/workflows/kimbiseo.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: widgets/kimbiseo

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: widgets/kimbiseo/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: pytest (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -v
      - name: pytest (Windows)
        if: runner.os == 'Windows'
        run: pytest -v
