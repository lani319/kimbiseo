name: build-log

on:
  push:
    branches: [master]
    paths:
      - ".claude/skills/build-log/**"
      - ".github/workflows/build-log.yml"
  pull_request:
    paths:
      - ".claude/skills/build-log/**"
      - ".github/workflows/build-log.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest -v .claude/skills/build-log/tests
